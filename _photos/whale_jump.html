<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monterey Bay, CA</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <video src="whale_jump.mp4" autoplay loop playsinline controls></video>
  <script>
    const video = document.querySelector("video");
    video.play().catch(function () {
      video.muted = true;
      video.play();
    });
  </script>
</body>
</html>
