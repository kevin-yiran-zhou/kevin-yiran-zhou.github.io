<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whale tail, Monterey Bay</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-note {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1;
      padding: 0.75rem 1rem 0.9rem;
      background: #111;
      color: #fff;
    }
    .video-note h1 {
      margin: 0 0 0.35rem;
      font-size: 1.05rem;
      line-height: 1.3;
    }
    .video-note p {
      margin: 0 0 0.45rem;
      max-width: 46rem;
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .video-note a {
      color: #b6ecf7;
    }
    .video-note a:focus-visible {
      outline: 3px solid #f89406;
      outline-offset: 2px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="video-note">
    <h1>Whale tail, Monterey Bay</h1>
    <p>A whale tail lifts out of the water, one fluke pale and the other dark, against a hazy horizon. The video starts muted. Use the player controls to turn sound on or pause it.</p>
    <p><a href="/photography/">Back to photography</a></p>
  </div>
  <video src="whale_tail.mp4" muted loop playsinline controls preload="metadata">
    A whale tail lifts out of the water at Monterey Bay.
  </video>
  <script>
    const video = document.querySelector("video");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduceMotion) {
      video.removeAttribute("loop");
      video.pause();
    } else {
      video.play().catch(function () {});
    }
  </script>
</body>
</html>
